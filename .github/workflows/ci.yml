name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button, for when GitHub drops a push event

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      node: ['20.19', '22', '24']
      exclude:
        - os: windows-latest
          node: '20.19'
        - os: windows-latest
          node: '22'
        - os: macos-latest
          node: '20.19'
        - os: macos-latest
          node: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --coverage --coverage.include='src/**'
      - run: npm run build
